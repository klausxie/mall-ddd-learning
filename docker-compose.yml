# 一条命令起本地依赖：docker compose up -d
# 库只负责建一个空库；建表由应用启动时的 Flyway 完成（src/main/resources/db/migration）。
services:
  mysql:
    image: mysql:8.0
    container_name: mall-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: mall
      MYSQL_USER: klaus
      MYSQL_PASSWORD: klaus
    ports:
      - "3306:3306"
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uklaus", "-pklaus" ]
      interval: 10s
      timeout: 5s
      retries: 10
