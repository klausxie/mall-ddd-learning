spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 默认指向本地 MySQL（docker-compose.yml 起的就是这套）；连自己的库请用环境变量或 application-local.yaml
    url: ${MALL_DB_URL:jdbc:mysql://localhost:3306/mall?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${MALL_DB_USERNAME:klaus}
    password: ${MALL_DB_PASSWORD:}
  sql:
    init:
      # 建表脚本由 docker compose 初始化或手工执行，不交给 Spring；
      # 设成 embedded 会让它在启动时探测库类型（连不上就刷 ERROR 日志），所以直接关掉
      mode: never

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml

mall:
  captcha:
    # 样例替身：固定验证码，便于直接 curl 注册。留空则验证码校验一律失败（宁可拦住也不误放行）
    # 真实项目必须删掉这一项
    fixed-code: 123456

