spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 默认指向本地 MySQL（docker-compose.yml 起的就是这套）；连自己的库请用环境变量或 application-local.yaml
    url: ${MALL_DB_URL:jdbc:mysql://127.0.0.1:3306/mall?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${MALL_DB_USERNAME:klaus}
    password: ${MALL_DB_PASSWORD:}
  sql:
    init:
      # 建表交给 Flyway；这条防止有人误放 schema.sql / data.sql 触发 Spring 自动初始化
      # （mode=embedded 会在启动时探测库类型，连不上就刷 ERROR 日志）
      mode: never
  flyway:
    # 迁移脚本：src/main/resources/db/migration/V*.sql，应用启动时自动执行
    locations: classpath:db/migration
    # 已经有手工建表的库（或历史环境）第一次接入时打 baseline，而不是报错
    baseline-on-migrate: true

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  # 值对象与数据库列之间的 TypeHandler 所在包（见 infrastructure/persistence）
  type-handlers-package: cn.mklaus.app.infrastructure.persistence

mall:
  captcha:
    # 样例替身：固定验证码，便于直接 curl 注册。留空则验证码校验一律失败（宁可拦住也不误放行）
    # 真实项目必须删掉这一项
    fixed-code: 123456

