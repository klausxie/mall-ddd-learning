name: verify

# 与本地 `./mvnw verify` 完全一致的门槛，另外用 service container 起一个 MySQL，
# 让真库测试（MapperSmokeTest / *ApiTest）也跑起来。
on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: mall
          MYSQL_USER: klaus
          MYSQL_PASSWORD: klaus
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uklaus -pklaus"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # 建表由 Flyway 在 Spring 上下文启动时完成；
      # verify = spotless:check + checkstyle + ArchUnit + 测试（含真库端到端）；
      # 这里给的是真库置备的**第一级**（显式配置）：用 service container 比在容器里再起容器快。
      # 本地不配任何东西也能跑全量：自动起 mysql:8.0，没 Docker 则降级 H2（见 README「验证」）。
      - name: Verify
        env:
          SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/mall?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true
          SPRING_DATASOURCE_USERNAME: klaus
          SPRING_DATASOURCE_PASSWORD: klaus
          APP_DB_PASSWORD: klaus
        # -Pcoverage-check：带真库测试跑覆盖率门槛（本地默认跳过真库测试，覆盖率会虚低）
        # 显式传 -D....skip=false：即便有人在 pom.xml 里把检查设成 skip，CI 也会照跑。
        # 与 GuardrailsTest 一外一内：那个测试查"配置没被改弱"，这里保证"就算改了也照样执行"。
        run: ./mvnw -B -Pcoverage-check -Dspotless.check.skip=false -Dcheckstyle.skip=false -DskipTests=false -Dmaven.test.skip=false -Djacoco.skip=false verify
